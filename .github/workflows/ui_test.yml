name: UI Visual Test

on:
  workflow_dispatch:
  push:
    branches: [ "ui-rework" ]

jobs:
  visual-test:
    name: Test UI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # Install System Dependencies for Linux (Headless Display)
    - name: Install Linux Libs
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils xvfb

    - name: Install Python Dependencies
      run: |
        pip install PySide6 qtawesome
        # Add any other requirements from your project
        # pip install -r requirements.txt

    # WINDOWS RUN
    - name: Run UI Test (Windows)
      if: runner.os == 'Windows'
      run: python capture_ui.py

    # LINUX RUN (Requires xvfb-run)
    - name: Run UI Test (Linux)
      if: runner.os == 'Linux'
      run: |
        # xvfb-run creates a fake monitor so Qt can render
        xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python capture_ui.py

    # MACOS RUN (Uses 'offscreen' plugin defined in python script)
    - name: Run UI Test (macOS)
      if: runner.os == 'macOS'
      run: python capture_ui.py

    - name: Upload Screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots-${{ matrix.os }}
        path: "*.png"