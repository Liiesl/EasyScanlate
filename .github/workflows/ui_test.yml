name: UI Visual Test

on:
  workflow_dispatch:
  push:
    branches: [ "ui-rework" ]

jobs:
  visual-test:
    name: Screenshot on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # --- LINUX SPECIFIC SETUP ---
    - name: Install Linux System Libs
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils xvfb

    # --- INSTALL DEPENDENCIES ---
    - name: Install Python Libs (and PyTorch)
      run: |
        pip install -r requirements.txt
        
        if [[ "${{ runner.os }}" == "macOS" ]]; then
          pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cpu
        else
          pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cu128
        fi
        
        # Alternatively: if you *only* want to specify these and not use requirements.txt
        # pip install PySide6 qtawesome torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cu128  # Linux & Windows
        # pip install PySide6 qtawesome torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cpu        # macOS

    # --- RUN TESTS ---

    # 1. Windows (Native)
    - name: Run Windows Test
      if: runner.os == 'Windows'
      run: python capture_ui.py

    # 2. Linux (Virtual Display)
    - name: Run Linux Test
      if: runner.os == 'Linux'
      run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" python capture_ui.py

    # 3. macOS (Offscreen Platform)
    - name: Run macOS Test
      if: runner.os == 'macOS'
      run: python capture_ui.py

    # --- UPLOAD ARTIFACTS ---
    - name: Upload Screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots-${{ matrix.os }}
        path: "*.png"