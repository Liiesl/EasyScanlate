name: UI Visual Test

on:
  workflow_dispatch:

jobs:
  visual-test:
    name: Screenshot on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # --- LINUX SPECIFIC SYSTEM LIBS ---
    - name: Install Linux System Libs
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-cursor0 x11-utils xvfb

    # --- INSTALL COMMON DEPENDENCIES ---
    - name: Install requirements.txt
      run: pip install -r requirements.txt

    # --- INSTALL PYTORCH (OS SPECIFIC) ---
    
    # CASE 1: macOS (CPU Only)
    - name: Install PyTorch (macOS)
      if: runner.os == 'macOS'
      run: pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cpu

    # CASE 2: Windows & Linux (CUDA)
    # Using '!=' is safer than trying to list both
    - name: Install PyTorch (Windows/Linux)
      if: runner.os != 'macOS'
      run: pip install torch==2.9.0 torchvision==0.24.0 --index-url https://download.pytorch.org/whl/cu128

    # --- RUN TESTS ---

    - name: Run Windows Test
      if: runner.os == 'Windows'
      run: python capture_ui.py

    - name: Run Linux Test
      if: runner.os == 'Linux'
      run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" python capture_ui.py

    - name: Run macOS Test
      if: runner.os == 'macOS'
      run: python capture_ui.py

    # --- UPLOAD ARTIFACTS ---
    - name: Upload Screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots-${{ matrix.os }}
        path: "*.png"