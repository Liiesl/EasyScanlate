[package]
name = "scanlateit-ui"
version = "0.1.0"
edition = "2024"

[features]
# Mirrors the root package's subsystem switches: the app crate toggles these
# to keep heavy ML/rig dependencies out of UI-only test builds.
default = ["translation"]
translation = ["dep:scanlateit-translation"]
ocr = []
inpaint = []
styling = []

[dependencies]
iced = { version = "0.14.0", path = "../iced", features = ["image", "canvas", "advanced", "tokio"] }
bytes = "1.6"
image = "0.25"
neverliie-iced-widgets = { path = "../NeverLiieIcedWidgets" }
scanlateit-model = { path = "../model" }
scanlateit-settings = { path = "../settings" }
scanlateit-translation = { path = "../translation", optional = true }
tokio = { version = "1", features = ["rt", "time"] }
open = "5"