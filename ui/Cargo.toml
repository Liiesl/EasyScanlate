[package]
name = "easyscanlate-ui"
version.workspace = true
edition.workspace = true

[features]
# Mirrors the root package's subsystem switches: the app crate toggles these
# to keep heavy ML/rig dependencies out of UI-only test builds.
default = ["translation"]
translation = ["dep:easyscanlate-translation"]
ocr = []
inpaint = []
styling = []
segment = ["dep:easyscanlate-segment"]

[dependencies]
# Mirrored locally in `iced/` (excluded workspace); version pinned in
# root `[workspace.dependencies] iced` ↔ `iced/Cargo.toml:157 version="0.14.0"`.
# AGENT: search `iced/` for iced internals (core/widget/graphics/etc.).
iced = { workspace = true }
bytes = { workspace = true }
image = { workspace = true }
neverliie-iced-widgets = { workspace = true }
easyscanlate-model = { workspace = true }
easyscanlate-settings = { workspace = true }
easyscanlate-translation = { workspace = true, optional = true }
easyscanlate-segment = { workspace = true, optional = true }
tokio = { workspace = true }
open = { workspace = true }
lucide-icons = { workspace = true }
