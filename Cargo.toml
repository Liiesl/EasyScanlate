[package]
name = "scanlateit"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["model", "inpaint", "ocr", "translation", "ui", "NeverLiieIcedWidgets"]
resolver = "3"
exclude = ["iced", "rapidocr-core", "NeverLiieIcedWidgets/examples"]

[dependencies]
iced = { version = "0.14.0", path = "iced", features = ["image", "canvas", "advanced", "tokio"] }
image = "0.25"
bytes = "1.6"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scanlateit-model = { path = "model" }
scanlateit-inpaint = { path = "inpaint" }
scanlateit-ocr = { path = "ocr" }
scanlateit-translation = { path = "translation" }
scanlateit-ui = { path = "ui" }
tokio = { version = "1", features = ["rt", "time"] }