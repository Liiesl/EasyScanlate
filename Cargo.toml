[package]
name = "easyscanlate"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["model", "inpaint", "ocr", "styling", "translation", "ui", "settings", "segment", "mmtl", "models-store"]
resolver = "3"
exclude = ["iced", "rapidocr-core", "NeverLiieIcedWidgets"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Shared external dependencies
# NOTE: `iced` 0.14.0 is mirrored locally in `iced/` (excluded workspace, see
# `iced/Cargo.toml:157 [workspace.package] version = "0.14.0"`). Keep this
# version in sync with `iced/` and `NeverLiieIcedWidgets/Cargo.toml:7`.
# AGENT: search `iced/` for iced source (core/widget/winit/etc.), not crates.io.
iced = { version = "0.14.0", features = ["image", "canvas", "advanced", "tokio"] }
image = "0.25"
bytes = "1.6"
rfd = "0.17"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
url = "2"
fast-down-api = { git = "https://github.com/fast-down/core.git" }
path_helper = { version = "=0.1.9", features = ["auto_ext", "sanitize", "tokio"] }
tokio-util = "0.7"
fontdb = "0.24"
tiny-skia = "0.11"
rayon = "1"
open = "5"
serde = { version = "1", features = ["derive"] }
lucide-icons = { version = "1", features = ["iced"] }
ndarray = "0.17"
ort = "2.0.0-rc.12"
imageproc = "0.25"
inpaint = { version = "0.1", features = ["image"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
rig = { version = "0.41.0", default-features = false, features = ["agent", "derive", "reqwest"] }
confy = "2"
toml = "1"
tempfile = "3"

# Internal path dependencies
easyscanlate-model = { path = "model" }
easyscanlate-settings = { path = "settings" }
easyscanlate-models = { path = "models-store" }
easyscanlate-inpaint = { path = "inpaint" }
easyscanlate-ocr = { path = "ocr" }
easyscanlate-styling = { path = "styling" }
easyscanlate-translation = { path = "translation" }
easyscanlate-segment = { path = "segment" }
easyscanlate-ui = { path = "ui", default-features = false }
easyscanlate-mmtl = { path = "mmtl" }
neverliie-iced-widgets = { path = "NeverLiieIcedWidgets" }
rapidocr-core = { version = "0.2.2", default-features = false }

[features]
# Subsystem switches. Building without one (e.g. `--no-default-features
# --features test-ui`) skips that crate entirely: no ort (ocr/inpaint/styling),
# no rig (translation), no velopack (`updates`) and no fast-down/reqwest
# (`models`) are compiled or linked. Disabled subsystems show a
# "unavailable in this build" status instead of running.
default = ["ocr", "inpaint", "styling", "translation", "segment", "directml", "file-assoc", "updates", "models"]
ocr = ["dep:easyscanlate-ocr", "easyscanlate-ui/ocr"]
inpaint = ["dep:easyscanlate-inpaint", "easyscanlate-ui/inpaint"]
styling = ["dep:easyscanlate-styling", "easyscanlate-ui/styling"]
translation = ["dep:easyscanlate-translation", "easyscanlate-ui/translation"]
segment = ["dep:easyscanlate-segment", "easyscanlate-ui/segment"]
directml = [
    "easyscanlate-ocr/directml",
    "easyscanlate-segment/directml",
    "easyscanlate-inpaint/directml",
]
# Convenience aliases: UI-only iteration (fake white image + fake OCR entries
# at boot, no ML backends), or exactly one real subsystem at a time.
# NOTE: `test-ui` intentionally enables neither `updates` (velopack) nor
# `models` (models-store → fast-down-api → reqwest). Build it with
# `--no-default-features --features test-ui` for the lean graph; plain
# `--features test-ui` on top of `default` still pulls the full weight
# because Cargo features are additive and cannot disable defaults.
updates = ["dep:velopack"]
models = ["dep:easyscanlate-models"]
test-ui = []
test-ocr = ["ocr"]
test-inpaint = ["inpaint"]
test-styling = ["styling"]
test-translation = ["translation"]
test-segment = ["segment"]
file-assoc = ["dep:winreg"]

[dependencies]
iced = { workspace = true }
image = { workspace = true }
bytes = { workspace = true }
rfd = { workspace = true }
neverliie-iced-widgets = { workspace = true }
easyscanlate-model = { workspace = true }
easyscanlate-settings = { workspace = true }
easyscanlate-models = { workspace = true, optional = true }
easyscanlate-inpaint = { workspace = true, optional = true }
easyscanlate-ocr = { workspace = true, optional = true }
easyscanlate-styling = { workspace = true, optional = true }
easyscanlate-translation = { workspace = true, optional = true }
easyscanlate-segment = { workspace = true, optional = true }
easyscanlate-ui = { workspace = true }
easyscanlate-mmtl = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
fontdb = { workspace = true }
tiny-skia = { workspace = true }
rayon = { workspace = true }
open = { workspace = true }
serde = { workspace = true }
lucide-icons = { workspace = true }
winreg = { version = "0.53", optional = true }
velopack = { version = "1.2", optional = true }

[profile.dev.package."*"]
debug = "line-tables-only"

[build-dependencies]
winres = "0.1"

[patch.crates-io]
rapidocr-core = { path = "rapidocr-rs/crates/rapidocr-core" }
